<!DOCTYPE html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>JPY → USD 通貨換算</title>
		<style>
			body {
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background: #f5f5f5;
			}

			.app {
				width: min(92vw, 420px);
				background: #ffffff;
				border: 1px solid #dddddd;
				border-radius: 10px;
				padding: 20px;
			}

			h1 {
				font-size: 20px;
				margin: 0 0 14px;
			}

			label {
				display: block;
				margin-bottom: 8px;
				font-weight: 600;
			}

			input {
				width: 100%;
				box-sizing: border-box;
				padding: 10px;
				border: 1px solid #bbbbbb;
				border-radius: 6px;
				font-size: 16px;
			}

			button {
				margin-top: 12px;
				width: 100%;
				padding: 10px;
				border: none;
				border-radius: 6px;
				background: #1f6feb;
				color: #fff;
				font-size: 16px;
				cursor: pointer;
			}

			#result,
			#error {
				margin-top: 12px;
			}

			#error {
				color: #b42318;
			}
		</style>
	</head>
	<body>
		<main class="app">
			<h1>JPY → USD 通貨換算</h1>
			<label for="jpyInput">日本円（JPY）</label>
			<input id="jpyInput" type="text" inputmode="decimal" placeholder="例: 1000" />
			<button id="convertButton" type="button">変換</button>
			<p id="error" aria-live="polite"></p>
			<p id="result" aria-live="polite"></p>
		</main>

		<script src="main.js"></script>
	</body>
</html>
