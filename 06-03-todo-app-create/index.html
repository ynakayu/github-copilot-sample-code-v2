<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ToDoアプリ</title>
</head>
<body>
	<main>
		<h1>ToDoアプリ</h1>

		<!-- タスク入力エリア -->
		<div>
			<label for="task_input">タスク</label>
			<input id="task_input" type="text" placeholder="例: 買い物に行く">
			<button id="add_button" type="button">追加</button>
		</div>

		<!-- タスク表示エリア -->
		<ul id="task_list"></ul>
	</main>

	<script src="./todo-list.js"></script>
</body>
</html>
