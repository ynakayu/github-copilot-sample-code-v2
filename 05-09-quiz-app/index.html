<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>◯×クイズ（日本）</title>
</head>
<body>
  <h1>◯×クイズ（日本に関する5問）</h1>

  <div id="meta"></div>
  <div id="question"></div>

  <div id="playArea">
    <button id="btnMaru">◯</button>
    <button id="btnBatsu">×</button>

    <div id="feedback"></div>

    <button id="btnNext" disabled>次へ</button>
  </div>

  <div id="resultArea" style="display:none;">
    <div id="result"></div>
    <button id="btnRestart">もう一度</button>
  </div>

  <script src="main.js"></script>
</body>
</html>
