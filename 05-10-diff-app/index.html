<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diffアプリ（差分チェック）</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 24px;
      line-height: 1.5;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 24px;
    }

    .input_grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .column_title {
      margin: 0 0 6px;
      font-weight: 700;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      box-sizing: border-box;
      padding: 8px;
    }

    .button_row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    button {
      padding: 8px 14px;
      cursor: pointer;
    }

    #message {
      min-height: 24px;
      margin-bottom: 12px;
      font-weight: 700;
    }

    #message.error {
      color: #b00020;
    }

    #message.info {
      color: #0f5b99;
    }

    .result_grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .panel {
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      overflow: hidden;
    }

    .panel_header {
      margin: 0;
      padding: 8px 10px;
      background: #f5f5f5;
      border-bottom: 1px solid #d0d0d0;
      font-size: 14px;
    }

    .lines {
      font-family: monospace;
      white-space: pre-wrap;
    }

    .line {
      padding: 6px 10px;
      border-bottom: 1px solid #efefef;
      min-height: 24px;
    }

    .line_content {
      display: grid;
      grid-template-columns: 44px 1fr;
      column-gap: 8px;
      align-items: start;
    }

    .line_number {
      color: #666666;
      text-align: right;
      user-select: none;
    }

    .line_text {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .char_removed {
      background: #f8caca;
      border-radius: 2px;
    }

    .char_added {
      background: #c9edc9;
      border-radius: 2px;
    }

    .line.same {
      background: #ffffff;
    }

    .line.added {
      background: #e8f7e8;
    }

    .line.removed {
      background: #fdeaea;
    }

    .line.empty {
      background: #fafafa;
    }
  </style>
</head>
<body>
  <h1>Diffアプリ（行単位）</h1>

  <div class="input_grid">
    <div>
      <p class="column_title">元テキスト</p>
      <textarea id="left_text" placeholder="比較元のテキストを入力してください"></textarea>
    </div>
    <div>
      <p class="column_title">新テキスト</p>
      <textarea id="right_text" placeholder="比較先のテキストを入力してください"></textarea>
    </div>
  </div>

  <div class="button_row">
    <button id="compare_button" type="button">比較する</button>
    <button id="reset_button" type="button">リセット</button>
  </div>

  <div id="message"></div>

  <div class="result_grid">
    <section class="panel">
      <h2 class="panel_header">元テキスト（削除を強調）</h2>
      <div id="left_result" class="lines"></div>
    </section>
    <section class="panel">
      <h2 class="panel_header">新テキスト（追加を強調）</h2>
      <div id="right_result" class="lines"></div>
    </section>
  </div>

  <script src="main.js"></script>
</body>
</html>
